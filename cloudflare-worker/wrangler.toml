name = "jivhala-cron-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Cloudflare Cron Trigger: triggers every minute
[triggers]
crons = ["* * * * *"]

# Non-sensitive environment variables
[vars]
# JIVHALA_APP_URL = "https://<your-project>.vercel.app"

# Secrets to configure via dashboard or `wrangler secret put`:
# - CRON_SECRET: Secret matching process.env.CRON_SECRET on Vercel
# - JIVHALA_APP_URL: (Can also be set as an environment variable)
